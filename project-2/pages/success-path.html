      <div class="thought-field">

          style="top: 24%; left: 50%; animation-duration: 7s;"

          data-text="I made a list. Pros on one side, cons on the other. As if a column could decide for me."
          >pros &amp;<br />cons</a
        >
        <a

          class="thought concept-node"

        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 76%; left: 31%; animation-duration: 7.5s; animation-delay: 1.6s;"

          data-text="I keep chasing a word I never defined for myself."
          >what does<br />it mean?</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 41%; left: 23%; animation-duration: 5.5s; animation-delay: 0.3s;"

          data-text="The graph says one thing. My gut says another."
          >data vs.<br />feeling</a
