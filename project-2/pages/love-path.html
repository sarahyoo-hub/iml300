<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Love</title>
    <link rel="stylesheet" href="../style.css" />
  </head>

  <body class="thoughts-page">
    <h1 class="thoughts-heading">Love</h1>

    <div class="value-stage">
      <svg class="value-circle" viewBox="0 0 400 400" aria-hidden="true">
        <path
          class="value-circle-inner"
          d="M 203 48 C 262 45 320 80 348 134 C 370 182 364 244 328 292 C 298 332 246 356 192 350 C 132 344 76 308 52 252 C 36 204 48 146 86 100 C 116 64 160 44 203 48 Z"
        />
        <path
          d="M 200 42 C 258 38 318 72 346 128 C 372 178 368 246 330 296 C 300 338 244 362 188 356 C 126 350 70 312 48 254 C 30 206 44 148 82 102 C 112 66 156 46 200 42 Z"
        />
      </svg>

      <div class="thought-field">
        <a
          href="#"
          class="thought concept-node"
          style="top: 24%; left: 50%; animation-duration: 7s;"
          data-title="The Fig Tree"
          data-text="Picture every future as a fig on the same branch &mdash; love, a family, a different life somewhere else. Reach for one and the rest start to rot."
          >the fig<br />tree</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 41%; left: 78%; animation-duration: 6s; animation-delay: 0.5s;"
          data-title="Dual Process Model"
          data-text="One part of me moves fast, on feeling. The other slows down, weighs and measures. They rarely agree."
          >heart vs.<br />brain</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 69%; left: 64%; animation-duration: 6.5s; animation-delay: 1.2s;"
          data-title="The Butterfly Effect"
          data-text="One choice and the whole shape of everything after it changes. I'll never know the version where I chose differently."
          >what<br />if?</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 76%; left: 31%; animation-duration: 8s; animation-delay: 1.8s;"
          data-title="No Undo"
          data-text="There's no going back to choose again. Whatever this is, it's the only one I get to live."
          >no<br />undo</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 41%; left: 23%; animation-duration: 5.5s; animation-delay: 0.3s;"
          data-title="Is This the Right One?"
          data-text="I don't think there is a right one. Just the one I pick, and what I build after."
          >is this<br />the one?</a
        >
      </div>
    </div>

    <div id="concept-card" class="concept-card">
      <button class="concept-card-close" aria-label="Close">&times;</button>
      <h2 class="concept-card-title"></h2>
      <p class="concept-card-text"></p>
    </div>

    <a href="#" id="back-button" class="back-button">Go back</a>
    <script src="../script.js"></script>
  </body>
</html>
