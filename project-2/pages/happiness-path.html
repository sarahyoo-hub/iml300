<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Happiness</title>
    <link rel="stylesheet" href="../style.css" />
  </head>

  <body class="thoughts-page">
    <h1 class="thoughts-heading">Happiness</h1>

    <div class="value-stage">
      <svg class="value-circle" viewBox="0 0 400 400" aria-hidden="true">
        <path
          class="value-circle-inner"
          d="M 203 48 C 262 45 320 80 348 134 C 370 182 364 244 328 292 C 298 332 246 356 192 350 C 132 344 76 308 52 252 C 36 204 48 146 86 100 C 116 64 160 44 203 48 Z"
        />
        <path
          d="M 200 42 C 258 38 318 72 346 128 C 372 178 368 246 330 296 C 300 338 244 362 188 356 C 126 350 70 312 48 254 C 30 206 44 148 82 102 C 112 66 156 46 200 42 Z"
        />
      </svg>

      <div class="thought-field">
        <a
          href="#"
          class="thought concept-node"
          style="top: 24%; left: 50%; animation-duration: 6.5s;"
          data-title="Lower the Bar"
          data-text="Secret to happiness: low expectations. Hope for less, and more of it surprises you."
          >lower<br />the bar</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 41%; left: 78%; animation-duration: 7.5s; animation-delay: 0.4s;"
          data-title="No Pleasant Surprises"
          data-text="When I expect everything to go well, nothing feels like a gift anymore."
          >no<br />surprises</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 69%; left: 64%; animation-duration: 6s; animation-delay: 1s;"
          data-title="Better, but Feels Worse"
          data-text="I have more options than anyone before me. Somehow that makes me feel worse, not better."
          >better but<br />feels worse</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 76%; left: 31%; animation-duration: 8s; animation-delay: 1.5s;"
          data-title="Everything Was Better"
          data-text="&ldquo;Everything was better back when everything was worse.&rdquo; We miss having fewer choices to make."
          >it was<br />better before</a
        >
        <a
          href="#"
          class="thought concept-node"
          style="top: 41%; left: 23%; animation-duration: 5.5s; animation-delay: 0.8s;"
          data-title="Who Do I Blame?"
          data-text="When it goes wrong, I blame myself first. Then the world. Never the number of choices I had."
          >who do<br />I blame?</a
        >
      </div>
    </div>

    <div id="concept-card" class="concept-card">
      <button class="concept-card-close" aria-label="Close">&times;</button>
      <h2 class="concept-card-title"></h2>
      <p class="concept-card-text"></p>
    </div>

    <a href="#" id="back-button" class="back-button">Go back</a>
    <script src="../script.js"></script>
  </body>
</html>
